services:
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - vpn
    environment:
      - TZ=Europe/Oslo
      - PUID=1000
      - PGID=1000
    ports:
      - 8989:8989
    volumes:
      - /opt/appdata/sonarr/config:/config
      - /data/torrents:/data/torrents

networks:
  vpn:
    external: true
