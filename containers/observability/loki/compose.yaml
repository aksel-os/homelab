services:
  loki:
    container_name: loki
    image: grafana/loki:latest
    restart: unless-stopped
    networks:
      - monitoring
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - /opt/appdata/loki/data:/loki
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro

networks:
  monitoring:
    external: true
