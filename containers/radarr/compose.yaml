services:
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - vpn
    environment:
      - TZ=Europe/Oslo
      - PUID=1000
      - PGID=1000
    ports:
      - 7878:7878
    volumes:
      - /opt/appdata/radarr/config:/config

networks:
  vpn:
    external: true
