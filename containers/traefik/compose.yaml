services:
  traefik:
    container_name: traefik
    image: traefik:v3.7
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
    ports:
      - 80:80
      - 443:443

networks:
  proxy:
    external: true
